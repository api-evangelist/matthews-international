description: >-
  Matthews International Corporation (NASDAQ: MATW) is a Pittsburgh, Pennsylvania
  diversified manufacturer founded in 1850 and reporting in three segments.
  Memorialization covers bronze and granite memorials, caskets, cremation-related
  products and cremation and incineration equipment for the cemetery and funeral home
  industries, sold through Matthews Aurora Funeral Solutions and Matthews Environmental
  Solutions. Industrial Technologies covers product identification — the Matthews
  Marking Systems marking and coding business and its MPERIA controller platform — plus
  the design, manufacture and service of custom energy storage solutions including
  dry-battery-electrode coating and converting lines. Brand Solutions is now a 40%
  ownership interest in Propelis Group, the entity formed on 1 May 2025 when Matthews
  contributed the majority of its SGK brand business; the company sold its warehouse
  automation business (Matthews Automation Solutions — Pyramid, Compass and Lightning
  Pick) to Duravant on 31 December 2025. Matthews is a manufacturer rather than a
  software vendor: it operates no public developer program and publishes no API
  documentation, SDK, package, CLI, MCP server, agent card or machine-readable
  specification. The MPERIA controller sold with its marking and coding equipment
  markets a "common API" for ERP, WMS, MES and PLC integration, but that is an
  on-premises XML or command-line protocol carried over Ethernet or RS-232 and
  documented only in sales collateral — not a public web API.
