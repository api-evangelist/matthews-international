limits:
  - name: Contract-scoped limit
    scope: customer-contract
    metric: varies
    limit: 'not publicly documented'
    applies:
      - MPERIA controller integrations (Matthews Marking Systems)
    notes: >-
      Matthews publishes no web API. Where an integration exists it is an on-premises MPERIA
      controller link (XML or command-line protocol over Ethernet or RS-232) governed by the
      equipment purchase contract, not by a published rate-limit policy. Nothing here was
      observed on a live HTTP response.
policies:
  - name: Backoff Strategy
    source: api-evangelist-recommendation
    description: >-
      NOT a published Matthews policy. General client-side guidance: exponential backoff with
      jitter on transient errors, and honor Retry-After if one is ever returned.
  - name: Contract-Scoped Limits
    source: api-evangelist-observation
    description: >-
      NOT a published Matthews policy. Any throughput, concurrency or polling-frequency
      obligation lives in the equipment or integration statement-of-work; there is no public
      developer doc that states one.
