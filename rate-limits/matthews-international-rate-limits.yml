description: Matthews International does not publish API rate limits because there is no public developer
  program. Any integration limits are negotiated inside the underlying solution contract (Memorialization,
  Industrial Technologies, SGK Brand Solutions) and are not externally documented.
notes: |
  limit_count is 0: Matthews International publishes ZERO rate limits, because it publishes no API.
  Re-verified 2026-08-13 — no developer portal, no API reference, no machine-readable spec on any
  Matthews-controlled host, and therefore no rate-limit headers to record.

  The scaffold-era `responseCodes` block asserting throttled=429 / serviceUnavailable=503 was REMOVED
  on 2026-08-13: it described status codes for an API that does not exist and no live response was
  ever observed. Likewise the entries under `policies` are API Evangelist client-side recommendations,
  not published Matthews policy, and are labelled as such.

  Set reconciled=true only if a public developer surface emerges.
